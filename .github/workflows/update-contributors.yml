name: update-contributors

on:
  push:
    branches: [master]
    paths:
      # 配置一更新就重新生成 contributors.json
      - 'config/active-contributors.yml'
  schedule:
    # 每天 06:00（Asia/Shanghai）= 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch contributors and write data/contributors.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributors.py

      - name: Commit and push if changed
        run: |
          git add data/contributors.json
          if git diff --cached --quiet; then
            echo "contributors.json unchanged, skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contributors.json"
          git push
